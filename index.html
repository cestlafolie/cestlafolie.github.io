<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#eef2f7">
<title>Vote</title>
<style>
  :root{
    --bg:#eef2f7;--panel:#ffffff;--nav:#0d1b2a;--nav-hover:#1a2b3d;--nav-active:#0891b2;
    --nav-text:#8fa3b8;--nav-title:#5a7085;--ink:#0e1a2b;--muted:#5d6b7d;--line:#dbe2ea;
    --brand:#0e7490;--brand-soft:#dcf2f7;--green:#16a34a;--green-soft:#e9f7ef;
    --amber:#d97706;--amber-soft:#fdf3e7;--red:#dc2626;--red-soft:#fdecec;--cyan:#06b6d4;
    --r:16px;--shadow:0 1px 2px rgba(14,26,43,.05),0 6px 20px rgba(14,26,43,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
  button{-webkit-tap-highlight-color:transparent}
  .page-head{margin-bottom:22px}
  .page-head h1{font-size:1.5rem;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
  .page-head h1 svg{width:24px;height:24px;color:var(--brand)}
  .page-head p{color:var(--muted);font-size:.9rem;margin-top:4px}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;margin-bottom:18px}
  .card-h{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .card-h .d{width:7px;height:7px;border-radius:50%;background:var(--brand)}
  .btn{border:none;border-radius:11px;padding:12px 22px;min-height:44px;font-size:.92rem;font-weight:600;cursor:pointer;font-family:inherit;transition:.1s;display:inline-flex;align-items:center;justify-content:center;gap:7px;touch-action:manipulation;-webkit-user-select:none;user-select:none}
  .btn:active{transform:scale(.97)}
  .btn:active{transform:translateY(1px)}.btn svg{width:17px;height:17px}
  .btn-full{width:100%;justify-content:center;margin-top:6px}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
  .chip:hover{border-color:var(--brand);color:var(--brand)}.chip svg{width:15px;height:15px}
  .field{margin-bottom:14px}
  label{display:block;font-size:.76rem;font-weight:600;color:var(--muted);margin-bottom:6px}
  input,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;min-height:44px;font-size:.95rem;font-family:inherit;background:#fff;color:var(--ink);font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
  input:focus,select:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
  .hint{font-size:.74rem;color:var(--muted);margin-top:4px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--nav);color:#fff;padding:12px 22px;border-radius:12px;font-size:.88rem;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:60}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .chip{min-height:40px}
  .vote-live{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .vote-live i{width:8px;height:8px;border-radius:50%;background:var(--amber)}
  .vote-live.on i{background:var(--green);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}100%{box-shadow:0 0 0 8px rgba(22,163,74,0)}}
  .vote-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
  .vote-btn{border:2px solid var(--line);background:#fff;border-radius:14px;padding:18px 10px;font-size:1.15rem;font-weight:800;cursor:pointer;font-family:inherit;transition:.12s;min-height:64px;touch-action:manipulation}
  .vote-btn.oui{color:var(--green)}.vote-btn.non{color:var(--red)}
  .vote-btn.oui.on{background:var(--green);border-color:var(--green);color:#fff}
  .vote-btn.non.on{background:var(--red);border-color:var(--red);color:#fff}
  .vote-btn:disabled{opacity:.45;cursor:not-allowed}
  .vote-res{margin-top:6px}
  .vote-row{margin-bottom:12px}
  .vote-row .lr{display:flex;justify-content:space-between;font-size:.88rem;font-weight:700;margin-bottom:5px;font-variant-numeric:tabular-nums}
  .vote-bar{height:14px;border-radius:7px;background:#eef0f6;overflow:hidden}
  .vote-bar div{height:100%;border-radius:7px;transition:width .4s ease;width:0}
  .vote-last{margin-top:16px;border-radius:13px;padding:12px 14px;text-align:center;background:#eef0f6}
  .vote-last.oui{background:var(--green-soft)}.vote-last.non{background:var(--red-soft)}
  .vote-last .vl-k{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}
  .vote-last .vl-v{font-size:1.4rem;font-weight:800;margin:2px 0}
  .vote-last.oui .vl-v{color:var(--green)}.vote-last.non .vl-v{color:var(--red)}
  .vote-last .vl-d{font-size:.78rem;color:var(--muted)}
  .vote-total{font-size:.8rem;color:var(--muted);margin-top:4px}
  .wrap{max-width:560px;margin:0 auto;padding:28px 16px calc(28px + env(safe-area-inset-bottom))}
  input,select,textarea{font-size:16px}
</style>
</head>
<body>
<main class="wrap">
        <div class="page-head"><h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>Vote</h1><p>Vote anonyme oui ou non, résultat en direct.</p></div>
        <div class="card">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
            <span class="vote-live" id="voteLive"><i></i><span>Connexion…</span></span>
            <button class="chip" id="btnAdmin">🔒 Admin</button>
          </div>
          <div class="vote-last" id="vLast" style="display:none"></div>
          <div class="vote-btns">
            <button class="vote-btn oui" data-v="oui">👍 Oui</button>
            <button class="vote-btn non" data-v="non">👎 Non</button>
          </div>
          <div class="hint" id="voteMine" style="margin:-6px 0 14px">Tu n'as pas encore voté.</div>
          <div class="vote-res">
            <div class="vote-row"><div class="lr"><span style="color:var(--green)">Oui</span><span id="vOuiTxt">0</span></div><div class="vote-bar"><div id="vOuiBar" style="background:var(--green)"></div></div></div>
            <div class="vote-row"><div class="lr"><span style="color:var(--red)">Non</span><span id="vNonTxt">0</span></div><div class="vote-bar"><div id="vNonBar" style="background:var(--red)"></div></div></div>
            <div class="vote-total" id="vTotal">0 vote</div>
          </div>
        </div>
        <div class="card" id="adminPanel" style="display:none">
          <div class="card-h"><span class="d"></span>Admin du vote</div>
          <div class="field"><label for="votePlayers">Nombre de joueurs (= votes max)</label><input type="number" id="votePlayers" min="0" max="99" step="1" inputmode="numeric" placeholder="illimité"></div>
          <button class="btn btn-full" id="btnVoteReset" style="background:var(--red-soft);color:var(--red)">Réinitialiser le vote</button>
          <button class="chip" id="btnAdminOut" style="margin-top:12px">Quitter le mode admin</button>
        </div>
      </main>
<div class="toast" id="toast"></div>
<script>
function load(k,def){try{return JSON.parse(localStorage.getItem(k))??def}catch{return def}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900)}
// ===== Vote en direct (relais temps réel : ntfy.sh, sans compte) =====
const VTOPIC='https://ntfy.sh/badgheure-vote-k7q2m9x4w8d1p5z3';
let vEvents=[], vResetAt=0, vPlayers={n:0,t:-1}, vSeen=new Set(), vSrc=null, vOrder=0;
const vMe=(()=>{let v=localStorage.getItem('badgheure_voter');if(!v){const a=new Uint8Array(12);crypto.getRandomValues(a);v=Array.from(a,b=>(b%36).toString(36)).join('');localStorage.setItem('badgheure_voter',v)}return v})();
function setLive(cls,txt){const el=document.getElementById('voteLive');el.className='vote-live '+cls;el.querySelector('span').textContent=txt}
function vPublish(obj){return fetch(VTOPIC,{method:'POST',body:JSON.stringify(obj)}).then(r=>{if(!r.ok)throw 0})}
// Manches : depuis la dernière réinitialisation admin, dès que N joueurs ont voté (N = nombre de joueurs),
// la manche est terminée, son résultat est affiché et une nouvelle manche démarre automatiquement.
// Dans une manche, seul le 1er vote de chaque personne compte.
let vLastRoundKey=null;
function vTally(){const ev=vEvents.filter(e=>e.t>=vResetAt).sort((x,y)=>x.t-y.t||x.o-y.o);const max=vPlayers.n;let ballots=new Map(),last=null,rounds=0;
  ev.forEach(e=>{if(ballots.has(e.u))return;ballots.set(e.u,e.v);
    if(max&&ballots.size>=max){let o=0,n=0;ballots.forEach(v=>v==='oui'?o++:n++);last={oui:o,non:n,t:e.t};rounds++;ballots=new Map()}});
  return {ballots,last,rounds}}
function vVerdict(o,n){return o>n?'OUI ✅':n>o?'NON ❌':'égalité'}
function renderVote(){const {ballots,last,rounds}=vTally(),max=vPlayers.n;let oui=0,non=0;ballots.forEach(v=>v==='oui'?oui++:non++);
  const tot=oui+non,po=tot?Math.round(oui/tot*100):0,pn=tot?100-po:0;
  document.getElementById('vOuiTxt').textContent=oui+' · '+po+' %';document.getElementById('vNonTxt').textContent=non+' · '+pn+' %';
  document.getElementById('vOuiBar').style.width=po+'%';document.getElementById('vNonBar').style.width=pn+'%';
  document.getElementById('vTotal').textContent=max?tot+' / '+max+' joueurs ont voté':tot+(tot>1?' votes':' vote');
  const lr=document.getElementById('vLast');
  if(last){lr.style.display='';lr.className='vote-last '+(last.oui>last.non?'oui':last.non>last.oui?'non':'eq');
    lr.innerHTML='';const t=document.createElement('div');t.className='vl-k';t.textContent='Résultat du dernier vote';
    const v=document.createElement('div');v.className='vl-v';v.textContent=vVerdict(last.oui,last.non);
    const d=document.createElement('div');d.className='vl-d';d.textContent=last.oui+' oui · '+last.non+' non — nouveau vote ouvert';lr.append(t,v,d)}
  else lr.style.display='none';
  const key=last?rounds+':'+last.t:null;if(vLive&&key&&vLastRoundKey!==null&&key!==vLastRoundKey)toast('Vote terminé : '+vVerdict(last.oui,last.non));vLastRoundKey=key||'';
  const pl=document.getElementById('votePlayers');if(document.activeElement!==pl)pl.value=max||'';
  const mine=ballots.get(vMe),blocked=!!mine;
  document.querySelectorAll('.vote-btn').forEach(b=>{b.classList.toggle('on',!!mine&&mine===b.dataset.v);b.disabled=blocked});
  document.getElementById('voteMine').textContent=mine?'Ton vote : '+mine.toUpperCase()+' (anonyme). Définitif jusqu’à la fin de ce vote.':'Tu n’as pas encore voté.'}
let vLive=false;setTimeout(()=>vLive=true,2500);
// --- Admin : seuls les messages signés avec la clé admin (débloquée par mot de passe) sont acceptés
const VADMIN={"pub": "BMragD96AUSFozDC1lvCc4NOii6S7sUlmi2j4JfSGvWxyN7KZDLT8lIQW0GVxmGXN3kjOI+GUkP8UpjLfLZRW4Q=", "salt": "YRCwiWqxX2biEY1F/CEZKg==", "iv": "r4Bvt6uCLQcO+0XD", "ct": "+Z2X+kawgw5VcNxw809Xlfi4WCDJ96eiSRc4Ah9D/+LJmoykSimKdyv4ZVQSSFSPB8e8JQVcCNFHG1gqyOxzrjBmEUeUPX1m/3T7GpX6rCi7a+GwpDAEWfa4CYlKLF4jGTMsFLKP2t2SxrFIP/zldUhLdtbtG9nr2WDUWpsndQZdW3bLPgRqsfmxYyRO2l+K5GhcavZmSmx7BA=="};
const b64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0)), tob64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const vPubKey=crypto.subtle.importKey('raw',b64(VADMIN.pub),{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
let vAdminKey=null, vNonces=new Set();
const vCanon=d=>JSON.stringify({k:d.k,n:d.n??null,nonce:d.nonce});
async function vVerify(d){try{if(typeof d.nonce!=='string'||typeof d.sig!=='string'||vNonces.has(d.nonce))return false;
  const ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},await vPubKey,b64(d.sig),new TextEncoder().encode(vCanon(d)));if(ok)vNonces.add(d.nonce);return ok}catch{return false}}
async function vAdminPublish(d){d.nonce=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,'0')).join('');
  d.sig=tob64(await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},vAdminKey,new TextEncoder().encode(vCanon(d))));return vPublish(d)}
async function vUnlock(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(VADMIN.salt),iterations:300000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(VADMIN.iv)},k,b64(VADMIN.ct)))}
async function vSetAdmin(pkcs8){vAdminKey=pkcs8?await crypto.subtle.importKey('pkcs8',pkcs8,{name:'ECDSA',namedCurve:'P-256'},false,['sign']):null;
  document.getElementById('adminPanel').style.display=vAdminKey?'':'none';document.getElementById('btnAdmin').textContent=vAdminKey?'🔓 Admin':'🔒 Admin';renderVote()}
document.getElementById('btnAdmin').onclick=async()=>{if(vAdminKey){document.getElementById('adminPanel').scrollIntoView({behavior:'smooth'});return}
  const pw=prompt('Mot de passe admin');if(!pw)return;
  try{const pk=await vUnlock(pw.trim());localStorage.setItem('badgheure_admin',tob64(pk));await vSetAdmin(pk);toast('Mode admin activé')}catch{toast('Mot de passe incorrect')}};
document.getElementById('btnAdminOut').onclick=()=>{localStorage.removeItem('badgheure_admin');vSetAdmin(null);toast('Mode admin désactivé')};
{const s=localStorage.getItem('badgheure_admin');if(s)vSetAdmin(b64(s)).catch(()=>localStorage.removeItem('badgheure_admin'))}
let vQueue=Promise.resolve();
function vHandle(m,d){
    if(d.k==='reset')vResetAt=Math.max(vResetAt,m.time);
    if(d.k==='players'&&Number.isInteger(d.n)&&d.n>=0&&m.time>=vPlayers.t)vPlayers={n:d.n,t:m.time};
    if(d.k==='v'&&(d.v==='oui'||d.v==='non')&&typeof d.u==='string')vEvents.push({u:d.u,v:d.v,t:m.time,o:vOrder++});
    renderVote()}
function vConnect(){vSrc=new EventSource(VTOPIC+'/sse?since=all');
  vSrc.onopen=()=>setLive('on','En direct');
  vSrc.onerror=()=>setLive('','Reconnexion…');
  vSrc.onmessage=ev=>{let m,d;try{m=JSON.parse(ev.data);d=JSON.parse(m.message)}catch{return}
    if(vSeen.has(m.id))return;vSeen.add(m.id);
    if(d.k==='reset'||d.k==='players')vQueue=vQueue.then(()=>vVerify(d)).then(ok=>{if(ok)vHandle(m,d)});
    else vQueue=vQueue.then(()=>vHandle(m,d))}}
document.getElementById('votePlayers').onchange=async e=>{if(!vAdminKey)return;const n=Math.max(0,Math.min(99,Math.round(+e.target.value||0)));
  try{await vAdminPublish({k:'players',n});toast(n?n+' joueurs : '+n+' votes max':'Sans limite de joueurs')}catch{toast('Échec, réessaie')}};
document.getElementById('btnVoteReset').onclick=async()=>{if(!vAdminKey)return;if(!confirm('Réinitialiser le vote pour tout le monde ?'))return;try{await vAdminPublish({k:'reset'});toast('Vote réinitialisé')}catch{toast('Échec, réessaie')}};
document.querySelectorAll('.vote-btn').forEach(b=>b.onclick=async()=>{if(b.disabled)return;document.querySelectorAll('.vote-btn').forEach(x=>x.disabled=true);try{await vPublish({k:'v',v:b.dataset.v,u:vMe});toast('Vote enregistré')}catch{toast('Échec de l\u2019envoi, réessaie');renderVote()}});
renderVote();vConnect();
</script>
</body>
</html>
