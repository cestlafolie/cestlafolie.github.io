<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#eef2f7">
<title>Jeux</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://ntfy.sh" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <span class="logo">🎲</span>
    <div><h1>Jeux</h1><p>Entre nous, en direct.</p></div>
  </div>
</header>

<!--
  Chaque fonctionnalité est un « module » : une <section class="module"> ici
  + un fichier JS à part (ex. vote.js). Pour en ajouter un, copier la structure
  d'un module existant et charger son script en bas de page.
-->
<main class="modules">

  <!-- ===== Module : vote oui / non ===== -->
  <section class="module" id="mod-vote">
    <div class="card">
      <div class="card-top">
        <h2>🗳️ Vote</h2>
        <span class="live" id="voteLive"><i></i><span>Connexion…</span></span>
      </div>
      <p class="sub">Anonyme · un seul vote par personne · résultat en direct</p>

      <div class="reveal" id="vLastWrap"><div><div class="last" id="vLast"></div></div></div>

      <div class="vote-btns">
        <button class="vote-btn oui" data-v="oui"><span>👍</span>Oui</button>
        <button class="vote-btn non" data-v="non"><span>👎</span>Non</button>
      </div>
      <p class="hint" id="voteMine">Tu n'as pas encore voté.</p>

      <div class="res">
        <div class="res-row"><div class="lr"><b class="c-oui">Oui</b><span id="vOuiTxt">0 · 0 %</span></div><div class="bar"><div id="vOuiBar" class="bg-oui"></div></div></div>
        <div class="res-row"><div class="lr"><b class="c-non">Non</b><span id="vNonTxt">0 · 0 %</span></div><div class="bar"><div id="vNonBar" class="bg-non"></div></div></div>
        <div class="progress"><span id="vTotal">0 vote</span><span class="dots" id="vDots"></span></div>
      </div>

      <button class="link-btn" id="btnAdmin">🔒 Admin</button>
    </div>

    <div class="reveal" id="adminWrap"><div>
      <div class="card admin">
        <div class="card-top"><h2>⚙️ Admin du vote</h2><button class="chip" id="btnAdminOut">Quitter</button></div>
        <label for="votePlayers">Nombre de joueurs (= votes attendus)</label>
        <div class="stepper">
          <button class="chip" id="plMinus" aria-label="Moins">−</button>
          <input type="number" id="votePlayers" min="0" max="99" step="1" inputmode="numeric" placeholder="∞">
          <button class="chip" id="plPlus" aria-label="Plus">+</button>
        </div>
        <p class="hint">Quand ce nombre de votes est atteint, le résultat s'affiche et un nouveau vote s'ouvre tout seul.</p>
        <button class="btn danger" id="btnVoteReset">Réinitialiser le vote</button>
      </div>
    </div></div>
  </section>

</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
<script src="vote.js"></script>
</body>
</html>
