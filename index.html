<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vote H">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23121110'/%3E%3Ccircle cx='66' cy='90' r='26' fill='%23d4f54a'/%3E%3Ccircle cx='114' cy='90' r='26' fill='%23ff5b3a'/%3E%3C/svg%3E">
<meta name="theme-color" content="#121110">
<meta name="color-scheme" content="dark">
<title>Vote secret H</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121110'/%3E%3Ccircle cx='24' cy='32' r='9' fill='%23d4f54a'/%3E%3Ccircle cx='42' cy='32' r='9' fill='%23ff5b3a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://ntfy.sh" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="scrim" id="scrim"></div>
<!-- Menu latéral : un bouton par onglet (data-tab = id du module sans « mod- ») -->
<aside class="sidenav" id="side">
  <a class="mark" href="./">jeux<span>.</span></a>
  <nav class="tabs">
    <p class="tabs-t">Onglets</p>
    <button class="tab" data-tab="vote"><i class="tab-ico"><b></b><b></b></i>Vote secret H</button>
  </nav>
  <p class="sidenav-foot">entre nous</p>
</aside>

<header class="top">
  <button class="burger" id="burger" aria-label="Menu"><span></span><span></span></button>
  <span class="top-title" id="topTitle">Vote secret H</span>
  <span class="live" id="voteLive"><i></i><span>connexion</span></span>
</header>

<!--
  Chaque onglet est un « module » : une <section class="module" id="mod-xxx"> ici,
  un bouton <button class="tab" data-tab="xxx"> dans le menu, et son propre fichier JS.
-->
<main class="modules">

  <!-- ===== Module : vote oui / non ===== -->
  <section class="module" id="mod-vote" data-title="Vote secret H">
    <div class="tag"><span>Anonyme</span><span id="vRound">Manche 1</span></div>
    <h2 class="q">On joue&nbsp;?</h2>

    <div class="vote-btns">
      <button class="vote-btn oui" data-v="oui"><b>Oui</b></button>
      <button class="vote-btn non" data-v="non"><b>Non</b></button>
    </div>
    <p class="mine" id="voteMine">Ton vote reste anonyme.</p>

    <div class="board">
      <div class="score">
        <div class="side oui"><span class="n" id="vOuiN">0</span><span class="p" id="vOuiP">0%</span></div>
        <span class="vs">—</span>
        <div class="side non"><span class="p" id="vNonP">0%</span><span class="n" id="vNonN">0</span></div>
      </div>
      <div class="split"><div id="vOuiBar"></div><div id="vNonBar"></div></div>
      <div class="progress"><span id="vTotal">0 vote</span><span class="segs" id="vDots"></span></div>
    </div>

    <div class="reveal" id="vLastWrap"><div><div class="last" id="vLast"></div></div></div>

    <button class="admin-link" id="btnAdmin">admin</button>

    <div class="reveal" id="adminWrap"><div>
      <div class="admin">
        <div class="admin-top"><span class="tag-s">Admin</span><button class="ghost" id="btnAdminOut">quitter</button></div>
        <label for="votePlayers">Joueurs attendus</label>
        <div class="stepper">
          <button id="plMinus" aria-label="Moins">−</button>
          <input type="number" id="votePlayers" min="0" max="99" step="1" inputmode="numeric" placeholder="∞">
          <button id="plPlus" aria-label="Plus">+</button>
        </div>
        <p class="note">Une fois ce nombre atteint, le résultat tombe et une nouvelle manche démarre.</p>
        <button class="danger" id="btnVoteReset">Tout remettre à zéro</button>
      </div>
    </div></div>
  </section>

</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
<script src="vote.js"></script>
</body>
</html>
